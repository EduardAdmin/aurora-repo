name: Publish Aurora Windows download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out download parts
        uses: actions/checkout@v4

      - name: Reassemble and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat release-parts/Aurora-Windows-x64.zip.part-* > "$RUNNER_TEMP/Aurora-Windows-x64.zip"
          echo "0bc8dbdae4a3978347b5a8b413d5ab707ffaeccd809390ce2d80c5826b06fa43  $RUNNER_TEMP/Aurora-Windows-x64.zip" | sha256sum --check

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.0 "$RUNNER_TEMP/Aurora-Windows-x64.zip" \
            --title "Aurora Desktop for Windows v1.0.0" \
            --target main \
            --notes "Aurora desktop shell for Windows. Requires an internet connection and an Aurora account."
